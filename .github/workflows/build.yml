name: Build installers

on:
  push:
    branches: [master, main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p rekordjog-core

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - os: windows-latest
            name: Windows
            targets: x86_64-pc-windows-msvc
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit tests (app)
        run: cargo test -p rekordjog

      - name: Build installer
        working-directory: app
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p dist
          find target -path "*bundle/dmg/*.dmg" -exec cp {} dist/ \;
          find target -path "*bundle/nsis/*-setup.exe" -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls dist)"

      - uses: actions/upload-artifact@v4
        with:
          name: RekordJog-${{ matrix.name }}
          path: dist/*

  # Always publish: every push updates the GitHub release for the current
  # version (creating the v<version> tag on GitHub if it doesn't exist yet).
  publish:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./app/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: RekordJog ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          body: |
            Use a Numark Mixtrack Go with rekordbox — one app, no mapping files.

            **macOS** (Apple Silicon + Intel): download the `.dmg`, drag RekordJog to Applications, then right-click → Open the first time (the app isn't notarised yet).

            **Windows 10/11**: run the `-setup.exe` (no admin needed). If SmartScreen appears: More info → Run anyway. Windows also needs the free [loopMIDI](https://www.tobias-erichsen.de/software/loopmidi.html) installed once for its virtual MIDI driver — the setup assistant walks you through it.

            Built from ${{ github.sha }}.
          files: dist/*
